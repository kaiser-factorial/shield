[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-shield"
version = "1.9.0"
description = "Prompt injection defense for LLM apps — detect, wrap, harden, and watch model output and tool calls"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []   # zero hard deps — anthropic/openai are optional
keywords = ["prompt-injection", "llm-security", "ai-security", "anthropic",
            "openai", "guardrails", "jailbreak-detection", "exfiltration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The DISTRIBUTION is prompt-shield; the IMPORT stays `shield`. Renaming the
# module too would break every consumer's import line for no benefit, and
# `from shield import ...` reads better than the dashed distribution name
# (which is not a legal identifier anyway).
[project.urls]
Homepage = "https://github.com/kaiser-factorial/shield"
Issues = "https://github.com/kaiser-factorial/shield/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai    = ["openai>=1.0"]
all       = ["anthropic>=0.20", "openai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["shield"]

# Lint and type-check config. Both run in CI; the code was already annotated,
# nothing was enforcing it.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow. The point is to catch real defects — undefined names,
# unused imports, mutable default arguments, except/pass that swallows a bug —
# not to enforce house style on a codebase that already reads consistently.
# "UP" (pyupgrade) is excluded on purpose: it wanted 83 Optional[X] -> X | None
# rewrites across both wrappers, which is churn with no security value and a
# large diff to review for nothing. "SIM" likewise: its findings here were all
# contextlib.suppress and ternary suggestions, none of them defects.
# E501 is off: several lines are long regex patterns that are worse wrapped.
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # anthropic / openai are optional deps
warn_unused_ignores = true
