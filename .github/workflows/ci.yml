name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      # Actions pinned to commit SHAs, not tags: a tag can be silently moved to
      # malicious code by a compromised action repo — the classic supply-chain
      # hit for a security library. Bump by updating the SHA + version comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: node --test dist/test/*.test.js

      # Printed as its own step so the precision/recall report is readable in
      # the log without scrolling the full test output. The floor is enforced
      # by the test above either way.
      - name: Detection benchmark
        run: node --test dist/test/benchmark.test.js

      - name: Versions in sync (TS ↔ Python)
        run: pnpm check:versions

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Lint (ruff)
        run: pipx run ruff check shield
        working-directory: python

      - name: Type check (mypy)
        run: pipx run mypy shield
        working-directory: python

      - name: Test
        run: python -m unittest discover -s tests -v
        working-directory: python

      - name: Detection benchmark
        run: python -m unittest tests.test_benchmark -v
        working-directory: python
